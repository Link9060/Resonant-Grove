<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Inventory Worksheet | Local Demo</title>
<style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f8f8f8;color:#171717}input,button{font:inherit;padding:.55rem}input{max-width:180px}button{cursor:pointer}form{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #ccc;padding:.7rem;text-align:left}output{display:block;margin:1rem 0;color:#7a1c1c}small{color:#555}</style>
</head>
<body><main><h1>Offline inventory worksheet</h1>
<p>Local demonstration only. No accounts, tracking, storage, uploads or network requests. Refresh resets the sample worksheet.</p>
<form id="add"><label>Item ID <input id="id" required pattern="[a-z0-9-]{1,40}" maxlength="40" placeholder="e.g. screws"></label><label>Name <input id="name" required maxlength="80" placeholder="e.g. Screws"></label><label>Quantity <input id="count" required type="number" min="0" max="1000000" step="1" value="0"></label><button>Add item</button></form>
<label for="search">Find item <input id="search" type="search" maxlength="80" placeholder="Name or ID" aria-describedby="search-count"></label>
<p id="search-count" role="status" aria-live="polite"></p>
<output id="message" role="status" aria-live="polite"></output>
<table><caption>Sample inventory, editable in memory</caption><thead><tr><th scope="col">Item</th><th scope="col">ID</th><th scope="col">Quantity</th><th scope="col">Action</th></tr></thead><tbody id="rows"></tbody></table>
<p><button id="export-csv" type="button">Download CSV snapshot</button> <button id="export-json" type="button">Download JSON backup</button> <label>Restore JSON backup <input id="import-json" type="file" accept=".json,application/json"></label> <button id="reset-worksheet" type="button">Reset sample worksheet</button></p>
<p><strong>Total units: <span id="total">0</span></strong></p><small>All figures are fictional fixtures. This is not a launched product.</small></main>
<script type="module">
import {createWorksheet,addItem,setCount} from './src/inventory.mjs';
import {removeItem,toCsv,renameItem,searchItems,toJson,fromJson} from './src/inventory.mjs';
const sampleRows=[{id:'bolts',name:'Bolts',count:3},{id:'nuts',name:'Nuts',count:5}];
let worksheet=createWorksheet(sampleRows);
const rows=document.querySelector('#rows'),message=document.querySelector('#message');
function render(){
 rows.replaceChildren();
 const matches=searchItems(worksheet,document.querySelector('#search').value);
 document.querySelector('#search-count').textContent=matches.length+' of '+worksheet.items.length+' items shown';
 if(matches.length===0){
  const empty=document.createElement('tr'),cell=document.createElement('td');
  cell.colSpan=4;cell.textContent=worksheet.items.length===0?'No items in this worksheet.':'No matching items. Clear the search to see all items.';
  empty.append(cell);rows.append(empty);
 }
 for(const item of matches){
  const tr=document.createElement('tr');
  for(const value of [item.name,item.id,String(item.count)]){const td=document.createElement('td');td.textContent=value;tr.append(td);}
  const td=document.createElement('td'),button=document.createElement('button');
  button.type='button';button.textContent='Set quantity';button.setAttribute('aria-label','Set quantity for '+item.name);
  button.addEventListener('click',()=>{
   const raw=prompt('New whole-number quantity for '+item.name,String(item.count));
   if(raw===null){message.textContent='Quantity edit canceled; worksheet unchanged';return;}
   try{if(!/^(0|[1-9][0-9]*)$/.test(raw))throw Error('Enter a whole number');worksheet=setCount(worksheet,item.id,Number(raw));message.textContent='Quantity updated';render();}
   catch(error){message.textContent=error.message;}
  });
  const rename=document.createElement('button');
  rename.type='button';rename.textContent='Rename';
  rename.setAttribute('aria-label','Rename '+item.name);
  rename.addEventListener('click',()=>{
   const nextName=prompt('New name for '+item.name,item.name);
   if(nextName===null){message.textContent='Rename canceled; worksheet unchanged';return;}
   try{worksheet=renameItem(worksheet,item.id,nextName);message.textContent='Item renamed';render();}
   catch(error){message.textContent=error.message;}
  });
  const remove=document.createElement('button');
  remove.type='button';remove.textContent='Remove';
  remove.setAttribute('aria-label','Remove '+item.name);
  remove.addEventListener('click',()=>{
   if(!confirm('Remove '+item.name+' from this worksheet?')){message.textContent='Removal canceled; worksheet unchanged';return;}
   try{worksheet=removeItem(worksheet,item.id);message.textContent='Item removed';render();}
   catch(error){message.textContent=error.message;}
  });
  td.append(button,rename,remove);tr.append(td);rows.append(tr);
 }
 document.querySelector('#total').textContent=String(worksheet.total);
}
document.querySelector('#search').addEventListener('input',()=>{try{render();message.textContent='';}catch(error){message.textContent=error.message;}});
document.querySelector('#add').addEventListener('submit',event=>{
 event.preventDefault();
 try{
  const rawCount=document.querySelector('#count').value;
  if(!/^(0|[1-9][0-9]*)$/.test(rawCount))throw Error('Enter a whole-number quantity');
  worksheet=addItem(worksheet,{id:document.querySelector('#id').value,name:document.querySelector('#name').value,count:Number(rawCount)});
  document.querySelector('#search').value='';
  message.textContent='Item added; search cleared';event.target.reset();render();
 }catch(error){message.textContent=error.message;}
});
document.querySelector('#reset-worksheet').addEventListener('click',()=>{
 if(!confirm('Discard local changes and restore the sample worksheet?')){message.textContent='Reset canceled; worksheet unchanged';return;}
 worksheet=createWorksheet(sampleRows);
 document.querySelector('#search').value='';
 message.textContent='Sample worksheet restored; search cleared';
 render();
});
document.querySelector('#export-json').addEventListener('click',()=>{
 try {
  const blob=new Blob([toJson(worksheet)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='inventory-backup.json';document.body.append(link);
  try {link.click();message.textContent='JSON backup prepared locally';}
  finally {link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 } catch(error) {message.textContent='JSON backup failed: '+error.message;}
});
document.querySelector('#import-json').addEventListener('change',async event=>{
 const input=event.target,file=input.files?.[0];
 if(!file)return;
 try {
  if(file.size>65536)throw Error('Backup exceeds 64 KiB');
  const restored=fromJson(await file.text());
  if(!confirm('Replace the current worksheet with this local backup?')){message.textContent='JSON restore canceled; worksheet unchanged';return;}
  worksheet=restored;
  document.querySelector('#search').value='';
  message.textContent='JSON backup restored locally; search cleared';
  render();
 } catch(error) {message.textContent='JSON restore failed: '+error.message;}
 finally {input.value='';}
});
document.querySelector('#export-csv').addEventListener('click',()=>{
 try {
  const csv=toCsv(worksheet);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download='inventory-snapshot.csv';
  document.body.append(link);
  try {link.click();message.textContent='CSV snapshot prepared locally';}
  finally {link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 } catch(error) {message.textContent='CSV export failed: '+error.message;}
});
render();
</script></body></html>
