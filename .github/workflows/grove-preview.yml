name: Grove development preview package

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/grove-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js autonomous-grove.js grove-agent-desk.js grove-scout-feed.js grove-seed-feed.js grove-build-feed.js grove-cloud.js; do
            node --check "$file"
          done
          node --test tests/*.test.mjs
      - name: Assemble standalone preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          for file in index.html styles.css app.js favicon.svg autonomous-grove.js autonomous-grove.css grove-agent-desk.js grove-agent-desk.css grove-scout-feed.js grove-seed-feed.js grove-build-feed.js grove-cloud.js grove-cloud.css; do
            test -s "$file"
            cp "$file" preview/
          done
          touch preview/.nojekyll
          # Stamp the exact tested source revision into every downloadable build.
          # This is an offline artifact only; it does not deploy to production.
          printf '%s\n' "GROVE_PREVIEW_SHA=${GITHUB_SHA}" "GROVE_PREVIEW_PR=${{ github.event.pull_request.number }}" "GROVE_PREVIEW_RUN=${GITHUB_RUN_ID}" > preview/REVIEW.txt
          # Render the verified SHA directly. Never derive the displayed revision from a URL fragment.
          cat > preview/review.html <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grove Review Build</title></head>
          <body><main style="font:16px system-ui;max-width:640px;margin:8vh auto;padding:24px">
          <h1>Grove review build</h1>
          <p>This is an unmerged development build, not the production website.</p>
          <p>Source commit: <code id="revision">${GITHUB_SHA}</code></p>
          <p><a href="./index.html">Open Grove development build</a></p>
          <p>Review changes before approving. Data is stored locally in your browser; use a separate browser profile for testing.</p>
          </main></body></html>
          EOF
          printf '%s\n' 'This is an artifact, NOT a hosted preview URL. Serve the extracted directory with a local HTTP server.' >> preview/REVIEW.txt
          test -s preview/review.html
          grep -Fq "<code id=\"revision\">${GITHUB_SHA}</code>" preview/review.html
          grep -Fq "GROVE_PREVIEW_SHA=${GITHUB_SHA}" preview/REVIEW.txt
      - name: Upload unmerged review artifact
        uses: actions/upload-artifact@v4
        with:
          name: grove-review-${{ github.sha }}
          path: preview/
          retention-days: 14
