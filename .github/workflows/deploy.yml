name: Deploy Grove to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js favicon.svg autonomous-grove.js autonomous-grove.css grove-agent-desk.js grove-agent-desk.css grove-scout-feed.js grove-seed-feed.js grove-build-feed.js grove-cloud.js grove-cloud.css _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/autonomous-grove.js
          test -s _site/autonomous-grove.css
          test -s _site/grove-scout-feed.js
          node --check _site/grove-scout-feed.js
          node --check _site/grove-seed-feed.js
          node --check _site/grove-build-feed.js
          test -s _site/grove-build-feed.js
          test -s _site/grove-seed-feed.js
          node --check _site/autonomous-grove.js
          node --check _site/grove-agent-desk.js
          node --test tests/grove-agent-desk.test.mjs
          node --check _site/grove-cloud.js
          test -s _site/grove-agent-desk.css
          test -s _site/grove-cloud.css
          grep -q 'id="groveAgentDesk"' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
