name: Autonomous Grove Opportunity Scout

on:
  # Once daily, not unlimited model usage. Scheduled runs can be delayed.
  schedule:
    - cron: '23 14 * * *'
    # Retry window if GitHub delays or skips the morning schedule.
    - cron: '23 20 * * *'
  workflow_dispatch:
  # A dry-run validates the trusted journal integration at installation.
  push:
    branches: [main]
    paths:
      - '.github/workflows/grove-scout.yml'
      - 'scripts/grove-scout-core.mjs'
      - 'scripts/grove-opportunity-scout.mjs'
      - 'scripts/grove-prototype.mjs'
      - 'scripts/grove-seed-evaluator.mjs'

concurrency:
  group: grove-autonomous-scout
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scout:
    if: >-
      github.repository == 'Link9060/Resonant-Grove' &&
      (github.event_name == 'schedule' || github.actor == 'Link9060' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROVE_SCOUT_ALREADY_DONE: 'false'
      GROVE_MODEL_AVAILABLE: 'false'
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check logic and bounded content policies
        run: |
          set -euo pipefail
          node --check scripts/grove-scout-core.mjs
          node --check scripts/grove-opportunity-scout.mjs
          node --check scripts/grove-prototype.mjs
          node --check scripts/grove-seed-evaluator.mjs
          node --check scripts/grove-worksheet-export.mjs
          node --test tests/grove-scout.test.mjs tests/grove-prototype.test.mjs tests/grove-worksheet-export.test.mjs tests/grove-seed-evaluator.test.mjs
      - name: Create daily research label if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh label list --limit 100 --json name --jq '.[].name' | grep -Fxq 'grove-scout'; then
            gh label create grove-scout --color 4f7c51 --description 'Unverified autonomous research, never a sales or Builder instruction'
          fi
      # Check public journal first so the second daily window does not pull a model again.
      # Failure to read GitHub is fatal rather than treating an unknown state as empty.
      - name: Check for an existing UTC research journal before model setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          titles="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&labels=grove-scout&per_page=100" --jq '.[].title')"
          if grep -Fxq "[GROVE-SCOUT] $today" <<< "$titles"; then
            echo "GROVE_SCOUT_ALREADY_DONE=true" >> "$GITHUB_ENV"
            echo "Research journal already exists for $today; expensive model preparation skipped."
          fi

      - name: Prepare optional local Ollama model with strict time limits
        if: ${{ github.event_name != 'push' && env.GROVE_SCOUT_ALREADY_DONE != 'true' }}
        timeout-minutes: 9
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --max-time 55 https://ollama.com/install.sh --output /tmp/grove-scout-install.sh; then
            echo "::warning::Ollama installer unavailable; research will use the clearly marked fallback."
            exit 0
          fi
          if ! timeout 100s sh /tmp/grove-scout-install.sh; then
            echo "::warning::Ollama installation timed out or failed; using fallback."
            exit 0
          fi
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/grove-scout-ollama.log 2>&1 &
          ready=false
          for n in $(seq 1 30); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::warning::Ollama service did not start; using fallback."
            exit 0
          fi
          if timeout 270s ollama pull qwen2.5:3b; then
            echo "GROVE_MODEL_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "Local Scout model is ready."
          else
            echo "::warning::Model download timed out or failed; using fallback."
          fi
      - name: Research safely and record one unverified journal per UTC day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROVE_SCOUT_DRY_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/grove-opportunity-scout.mjs
      - name: Archive offline printable worksheet for human review
        if: ${{ github.event_name != 'push' && env.GROVE_SCOUT_ALREADY_DONE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: grove-scout-draft-${{ github.run_id }}
          path: grove-scout-artifact/
          if-no-files-found: warn
          retention-days: 14
