name: Grove Weekly Seed Keeper

on:
  # Daily catch-up heartbeat; durable weekly issue key limits output to 1/week.
  # 22:43 UTC, after the second Scout research window.
  schedule:
    - cron: '43 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grove-seed-keeper.yml'
      - 'scripts/grove-seed-keeper.mjs'
      - 'scripts/grove-seed-keeper-core.mjs'

concurrency:
  group: grove-weekly-seed-keeper
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  seed-keeper:
    if: >-
      github.repository == 'Link9060/Resonant-Grove' &&
      (github.event_name == 'schedule' || github.actor == 'Link9060' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify policy logic before executing
        run: |
          set -euo pipefail
          node --check scripts/grove-seed-keeper-core.mjs
          node --check scripts/grove-seed-keeper.mjs
          node --test tests/grove-seed-keeper.test.mjs
      - name: Inspect research and create at most one internal plan this week
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROVE_SEED_DRY_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/grove-seed-keeper.mjs
