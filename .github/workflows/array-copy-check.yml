name: Validate ARRAY Builder

on:
  pull_request:
    paths:
      - 'scripts/array-copy-editor.mjs'
      - 'scripts/array-code-worker.mjs'
      - 'scripts/array-css-recovery.mjs'
      - 'scripts/array-direct-patch.mjs'
      - 'scripts/array-supervisor-core.mjs'
      - 'scripts/array-supervisor.mjs'
      - 'scripts/array-queue-verify.mjs'
      - 'scripts/array-auditor.mjs'
      - 'scripts/array-audit-runner.mjs'
      - 'tests/array-copy-editor.test.mjs'
      - 'tests/array-code-worker.test.mjs'
      - 'tests/array-css-recovery.test.mjs'
      - 'tests/array-direct-patch.test.mjs'
      - 'tests/array-supervisor.test.mjs'
      - 'tests/array-queue-verify.test.mjs'
      - 'tests/array-auditor.test.mjs'
      - 'tests/array-dispatch.test.mjs'
      - '.github/workflows/array-builder.yml'
      - '.github/workflows/array-supervisor.yml'
      - '.github/workflows/array-auditor.yml'
      - '.github/workflows/array-copy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and editor tests
        run: |
          node --check app.js
          node --check scripts/array-copy-editor.mjs
          node --check scripts/array-code-worker.mjs
          node --check scripts/array-css-recovery.mjs
          node --check scripts/array-direct-patch.mjs
          node --check scripts/array-supervisor-core.mjs
          node --check scripts/array-supervisor.mjs
          node --check scripts/array-queue-verify.mjs
          node --check scripts/array-auditor.mjs
          node --check scripts/array-audit-runner.mjs
          node --test tests/*.test.mjs
