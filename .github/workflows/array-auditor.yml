name: ARRAY Auditor (review-only by default)

on:
  workflow_run:
    workflows: ["ARRAY Builder (local Ollama, review-only)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Existing ARRAY Builder GitHub Actions run ID"
        required: true
        type: string

concurrency:
  group: array-auditor-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    # Only trusted completed Builder runs or explicit owner manual requests.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.actor.login == 'Link9060') ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'Link9060')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout trusted main only (never PR code)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate auditor code and policy
        run: |
          set -euo pipefail
          node --check scripts/array-auditor.mjs
          node --check scripts/array-audit-runner.mjs
          node --test tests/array-auditor.test.mjs

      - name: Inspect PR against original owner task and trusted GitHub run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARRAY_TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ARRAY_TRIGGER: ${{ github.event_name }}
          # DELIBERATELY DEFAULTS OFF. Repository owner must opt in.
          ARRAY_AUTO_MERGE: ${{ vars.ARRAY_AUTO_MERGE }}
        run: |
          set -euo pipefail
          node scripts/array-audit-runner.mjs
