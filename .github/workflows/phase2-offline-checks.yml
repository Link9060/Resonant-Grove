name: Phase 2 offline venture checks

on:
  pull_request:
    paths:
      - 'phase2/**'
      - 'ventures/offline-inventory/**'
      - 'tests/phase2-*.test.mjs'
      - '.github/workflows/phase2-offline-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'phase2/venture-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Phase 2 source syntax
        run: |
          node --version
          node --check phase2/evaluate.mjs
          node --check phase2/spec.mjs
          node --check ventures/offline-inventory/src/inventory.mjs
          node --check ventures/offline-inventory/tests/restore-fixtures.mjs
      - name: Execute isolated offline Phase 2 tests
        run: node --test tests/phase2-*.test.mjs ventures/offline-inventory/tests/*.test.mjs
      - name: Smoke-test fictional restore fixture CLI
        run: |
          set -eu
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          node ventures/offline-inventory/tests/restore-fixtures.mjs "$fixture_dir"
          for name in restore-a.json restore-b.json invalid-total.json oversized.json; do
            test -s "$fixture_dir/$name"
          done
          if node ventures/offline-inventory/tests/restore-fixtures.mjs "$fixture_dir"; then
            echo "ERROR: fixture generator overwrote existing files"
            exit 1
          fi
          echo "P2-QA-099: four fixtures created; overwrite correctly refused"
          outside_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir" "$outside_dir"' EXIT
          ln -s "$outside_dir" "$fixture_dir/linked"
          if node ventures/offline-inventory/tests/restore-fixtures.mjs "$fixture_dir/linked/nested"; then
            echo "ERROR: fixture generator accepted symlinked parent"
            exit 1
          fi
          for name in restore-a.json restore-b.json invalid-total.json oversized.json; do
            if test -e "$outside_dir/nested/$name"; then
              echo "ERROR: fixture generator wrote outside selected directory"
              exit 1
            fi
          done
          echo "P2-QA-118: symlinked output parent rejected without external writes"
          ln -s "$outside_dir" "$fixture_dir/direct-link"
          if node ventures/offline-inventory/tests/restore-fixtures.mjs "$fixture_dir/direct-link"; then
            echo "ERROR: fixture generator accepted direct symlink destination"
            exit 1
          fi
          for name in restore-a.json restore-b.json invalid-total.json oversized.json; do
            if test -e "$outside_dir/$name"; then
              echo "ERROR: fixture generator wrote through direct symlink"
              exit 1
            fi
          done
          echo "P2-QA-120: direct symlink output rejected without external writes"
          # P2-QA-124: dangling symlink must not be treated as an available output directory.
          ln -s "$fixture_dir/missing-target" "$fixture_dir/dangling-link"
          if node ventures/offline-inventory/tests/restore-fixtures.mjs "$fixture_dir/dangling-link"; then
            echo "ERROR: fixture generator accepted dangling symlink destination"
            exit 1
          fi
          test ! -e "$fixture_dir/missing-target"
          test -L "$fixture_dir/dangling-link"
          echo "P2-QA-124: dangling symlink output rejected without creating target"
          # P2-QA-143: root output must be rejected before any writes.
          if node ventures/offline-inventory/tests/restore-fixtures.mjs /; then
            echo "ERROR: fixture generator accepted filesystem root"
            exit 1
          fi
          echo "P2-QA-143: filesystem root output rejected"
          # P2-QA-149: an occupied later fixture must not cause partial output.
          partial_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir" "$outside_dir" "$partial_dir"' EXIT
          printf 'keep-me' > "$partial_dir/oversized.json"
          if node ventures/offline-inventory/tests/restore-fixtures.mjs "$partial_dir"; then
            echo "ERROR: fixture generator accepted occupied later output"
            exit 1
          fi
          test "$(cat "$partial_dir/oversized.json")" = "keep-me"
          for name in restore-a.json restore-b.json invalid-total.json; do
            if test -e "$partial_dir/$name"; then
              echo "ERROR: fixture generator partially created $name"
              exit 1
            fi
          done
          echo "P2-QA-149: occupied later fixture preserves contents and prevents partial writes"
