name: ARRAY Builder (review-only)

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Small, specific Grove improvement for Builder to implement"
        required: true
        type: string

# Nothing runs without a manual owner-initiated dispatch.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: array-builder-grove
  cancel-in-progress: false

jobs:
  builder:
    if: github.actor == 'Link9060'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration
        env:
          ARRAY_MODEL: ${{ vars.ARRAY_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARRAY_OBJECTIVE: ${{ inputs.objective }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY to Grove's Actions secrets before starting Builder."
            exit 1
          fi
          if [ -z "$ARRAY_MODEL" ]; then
            echo "::error::Add ARRAY_MODEL to Grove's Actions variables (use a currently available openrouter model ID)."
            exit 1
          fi
          if [ -z "$ARRAY_OBJECTIVE" ] || [ "$(printf %s "$ARRAY_OBJECTIVE" | wc -c)" -gt 1200 ]; then
            echo "::error::Objective must contain 1 to 1200 characters."
            exit 1
          fi

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Run ARRAY Builder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARRAY_MODEL: ${{ vars.ARRAY_MODEL }}
          ARRAY_OBJECTIVE: ${{ inputs.objective }}
        run: |
          set -euo pipefail
          git switch -c "array/builder-$GITHUB_RUN_ID"
          cat > /tmp/array-builder-instructions.txt <<'EOF'
          You are ARRAY Builder working in the Resonant Grove repository.
          Implement the user objective as a SMALL, reviewable change to this existing website.
          You may modify only app.js, index.html, styles.css, README.md, or favicon.svg.
          Do NOT touch CI workflows, authentication, secrets, billing, deployments, or other repositories.
          Do not invoke git push, gh, or publish anything. Changes will be reviewed in a pull request.
          Preserve existing features and visual quality. Verify JavaScript syntax if you change app.js.
          If the task cannot be completed safely, explain why instead of making unrelated changes.
          EOF
          printf '\nObjective:\n%s\n' "$ARRAY_OBJECTIVE" >> /tmp/array-builder-instructions.txt
          opencode run --standalone --auto --model "$ARRAY_MODEL" "$(cat /tmp/array-builder-instructions.txt)"

      - name: Stage allowed source files and validate
        run: |
          set -euo pipefail
          # Never stage .github/, credentials, or files outside the website allowlist.
          git add -- app.js index.html styles.css README.md favicon.svg
          if git diff --cached --quiet; then
            echo "::error::Builder did not produce an allowed source change."
            exit 1
          fi
          git diff --cached --check
          node --check app.js
          test -s index.html
          test -s styles.css
          git diff --cached --stat
          git status --short

      - name: Publish draft pull request (never merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARRAY_OBJECTIVE: ${{ inputs.objective }}
        run: |
          set -euo pipefail
          git config user.name "ARRAY Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: proposed Grove improvement via ARRAY Builder"
          gh auth setup-git
          git push --set-upstream origin "HEAD:array/builder-$GITHUB_RUN_ID"
          printf 'ARRAY Builder proposed a review-only change.\n\nObjective:\n%s\n\nValidation: git diff --check, node --check app.js, and required site files.\n\nThis change has NOT been merged or deployed. Review carefully before merging.\n' "$ARRAY_OBJECTIVE" > /tmp/array-pr-body.md
          gh pr create --base main --head "array/builder-$GITHUB_RUN_ID" \
            --draft --title "ARRAY Builder: Grove improvement #$GITHUB_RUN_ID" \
            --body-file /tmp/array-pr-body.md
