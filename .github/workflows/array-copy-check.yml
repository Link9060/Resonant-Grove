name: Validate ARRAY Safe Editor

on:
  pull_request:
    paths:
      - 'scripts/array-copy-editor.mjs'
      - 'tests/array-copy-editor.test.mjs'
      - '.github/workflows/array-builder.yml'
      - '.github/workflows/array-copy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and editor tests
        run: |
          node --check app.js
          node --check scripts/array-copy-editor.mjs
          node --test tests/array-copy-editor.test.mjs
