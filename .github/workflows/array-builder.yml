name: ARRAY Builder (local Ollama, review-only)

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Small, specific Grove website improvement for Builder"
        required: true
        type: string
      mode:
        description: "copy = wording only; code = bounded multi-file implementation"
        type: choice
        required: true
        default: copy
        options: [copy, code]
  # Owner-created [ARRAY] issues are the ChatGPT-to-Builder handoff.
  issues:
    types: [opened]

concurrency:
  group: array-builder-grove
  cancel-in-progress: false

jobs:
  build-proposal:
    # Manual run by owner, or owner-created issue with exact [ARRAY] prefix.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Link9060') ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'Link9060' &&
       (startsWith(github.event.issue.title, '[ARRAY] ') ||
        startsWith(github.event.issue.title, '[ARRAY-CODE] ')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout Grove without persistent git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate objective
        env:
          ARRAY_OBJECTIVE: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.objective }}
        run: |
          set -euo pipefail
          if [ -z "$ARRAY_OBJECTIVE" ] || [ "$(printf '%s' "$ARRAY_OBJECTIVE" | wc -c)" -gt 1200 ]; then
            echo "::error::Objective must contain 1 to 1200 bytes."
            exit 1
          fi

      - name: Install Ollama and load local coding model
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/array-ollama-install.sh
          sh /tmp/array-ollama-install.sh
          OLLAMA_HOST=127.0.0.1:11434 OLLAMA_CONTEXT_LENGTH=16384 ollama serve >/tmp/array-ollama.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
          ollama list

      - name: Run bounded ARRAY coding worker
        env:
          ARRAY_OBJECTIVE: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.objective }}
          ARRAY_MODE: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[ARRAY-CODE] ') && 'code' || inputs.mode || 'copy' }}
        run: |
          set -euo pipefail
          if [ "$ARRAY_MODE" = "code" ]; then
            echo "ARRAY v2: bounded code mode (max 3 edits across 2 files)."
            node --check scripts/array-code-worker.mjs
            node --test tests/array-code-worker.test.mjs
            node scripts/array-code-worker.mjs
          elif [ "$ARRAY_MODE" = "copy" ]; then
            echo "ARRAY v1: one safe user-facing wording edit."
            node --check scripts/array-copy-editor.mjs
            node --test tests/array-copy-editor.test.mjs
            node scripts/array-copy-editor.mjs
          else
            echo "::error::Unsupported ARRAY mode."
            exit 1
          fi

      - name: Validate proposed changes
        run: |
          set -euo pipefail
          # Only permitted website files are eligible for publication.
          git add -A -- app.js index.html styles.css
          # The code agent may edit at most two source files; model-created files are excluded.
          if git diff --cached --quiet; then
            echo "::error::Builder made no allowed changes."
            exit 1
          fi
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
            echo "::error::Builder cannot delete website files."
            exit 1
          fi
          git diff --cached --check
          node --check app.js
          test -s index.html
          test -s styles.css
          # Reject any diff that grows beyond a bounded source-change budget.
          if [ "$(git diff --cached --numstat | awk '{a+=$1; d+=$2} END{print a+d+0}')" -gt 45 ]; then
            echo "::error::ARRAY source change is too large."
            exit 1
          fi
          mkdir -p array-proposal
          cp -- app.js index.html styles.css README.md favicon.svg array-proposal/
          git diff --cached --stat

      - name: Upload review-only proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: grove-builder-proposal
          path: array-proposal/
          if-no-files-found: error
          retention-days: 3

  publish-draft:
    needs: build-proposal
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Link9060') ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'Link9060' &&
       (startsWith(github.event.issue.title, '[ARRAY] ') ||
        startsWith(github.event.issue.title, '[ARRAY-CODE] ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout main (no model credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download verified proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: grove-builder-proposal
          path: array-proposal/

      - name: Re-validate and prepare branch
        run: |
          set -euo pipefail
          for f in app.js index.html styles.css README.md favicon.svg; do
            test -f "array-proposal/$f" && test ! -L "array-proposal/$f"
            cp -- "array-proposal/$f" "$f"
          done
          node --check app.js
          test -s index.html
          test -s styles.css
          git add -A -- app.js index.html styles.css README.md favicon.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Proposal produced no effective changes."
            exit 1
          fi
          git config user.name "ARRAY Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "array/builder-$GITHUB_RUN_ID"
          git commit -m "feat: ARRAY Builder Grove proposal"
          git show --stat --oneline --format=short HEAD

      - name: Publish draft pull request (no automated merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARRAY_OBJECTIVE: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.objective }}
          ARRAY_ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
          ARRAY_MODE: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[ARRAY-CODE] ') && 'code' || inputs.mode || 'copy' }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "HEAD:array/builder-$GITHUB_RUN_ID"
          {
            printf 'Review-only automated Grove proposal.\n\n**Objective:**\n\n'
            printf '%s\n' "$ARRAY_OBJECTIVE"
            if [ -n "$ARRAY_ISSUE_NUMBER" ]; then
              printf '\n**Requested from:** issue #%s (opened by repository owner).\n' "$ARRAY_ISSUE_NUMBER"
            fi
            printf '\n**Mode:** %s\n' "$ARRAY_MODE"
            printf '\n**Checks:** app.js syntax, required site files, staged diff check.\n'
            printf '\n**Safety:** No merge or deployment was performed. Inspect every change before merging.\n'
          } > /tmp/array-builder-pr.md
          pr_url="$(gh pr create --draft --base main --head "array/builder-$GITHUB_RUN_ID" \
            --title "ARRAY Builder: Grove change #$GITHUB_RUN_ID" --body-file /tmp/array-builder-pr.md)"
          printf 'Draft PR: %s\n' "$pr_url"
          if [ -n "$ARRAY_ISSUE_NUMBER" ]; then
            # Link results to their originating issue; never close the issue or merge code.
            if ! gh issue comment "$ARRAY_ISSUE_NUMBER" --body "ARRAY Builder created a draft code proposal for review: $pr_url

            This is not deployed. Inspect the changes before approving any merge."; then
              echo "::warning::Draft PR created, but adding the issue result comment failed."
            fi
          fi
