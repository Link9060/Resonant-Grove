name: Validate Autonomous Grove

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'autonomous-grove.js'
      - 'grove-scout-feed.js'
      - 'scripts/grove-scout-core.mjs'
      - 'scripts/grove-prototype.mjs'
      - 'scripts/grove-seed-evaluator.mjs'
      - 'tests/grove-seed-evaluator.test.mjs'
      - 'scripts/grove-worksheet-export.mjs'
      - 'tests/grove-worksheet-export.test.mjs'
      - 'tests/grove-prototype.test.mjs'
      - 'scripts/grove-opportunity-scout.mjs'
      - 'tests/grove-scout.test.mjs'
      - '.github/workflows/grove-scout.yml'
      - 'autonomous-grove.css'
      - 'tests/autonomous-grove.test.mjs'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-autonomous.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and autonomy guardrail checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check autonomous-grove.js
          node --check grove-scout-feed.js
          node --check scripts/grove-scout-core.mjs
          node --check scripts/grove-prototype.mjs
          node --check scripts/grove-seed-evaluator.mjs
          node --check scripts/grove-worksheet-export.mjs
          node --check scripts/grove-opportunity-scout.mjs
          node --test tests/autonomous-grove.test.mjs tests/grove-scout.test.mjs tests/grove-prototype.test.mjs tests/grove-worksheet-export.test.mjs tests/grove-seed-evaluator.test.mjs
          test -s index.html
          test -s autonomous-grove.css
